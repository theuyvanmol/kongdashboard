<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KONG Sales – My commission</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050e09;--t1:#f6faf6;--t2:#a9bcae;--t3:#7c9282;--mint:#7be3b0;--amber:#ffcf70;--coral:#ff8478;--line:rgba(255,255,255,.12);--green:#06c755}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at top,#0e2616 0%,#050e09 62%);color:var(--t1);font-family:'Noto Sans Thai','Inter',sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none}
body::before{width:520px;height:520px;top:-160px;left:-120px;background:#18915c;opacity:.45}
body::after{width:460px;height:460px;bottom:-140px;right:-100px;background:#b8923a;opacity:.28}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 80px}
.glass{position:relative;border-radius:24px;padding:18px;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 45%),linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),rgba(8,20,14,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(120,255,200,.12)}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.08) 25%,rgba(255,255,255,.02) 60%,rgba(140,255,205,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:17px;margin:0;flex:1;font-weight:800;letter-spacing:.01em}
.top h1 small{display:block;font-size:11px;color:var(--t3);font-weight:400}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--t1);border-radius:999px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.pill.on{background:linear-gradient(135deg,#b3a3ff,#7ea82a);color:#04101a;border-color:transparent}
.who{display:none;gap:8px;margin-bottom:14px;overflow-x:auto}
.who .pill{white-space:nowrap}
.hero{text-align:center;padding:26px 18px 20px;margin-bottom:12px;overflow:hidden}
.hero .lbl{font-size:14px;color:var(--t2);font-weight:600}
.hero .big{font-family:'Inter',sans-serif;font-size:60px;font-weight:800;line-height:1.1;margin:6px 0 2px;background:linear-gradient(180deg,#fff,#7be3b0);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .big sup{font-size:26px;vertical-align:top;margin-right:3px;-webkit-text-fill-color:#7be3b0}
.hero .sub{font-size:13px;color:var(--t2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{padding:14px 14px 12px;border-radius:20px}
.mini .lbl{font-size:12px;color:var(--t2);font-weight:600}
.mini .num{font-family:'Inter';font-size:26px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.mini.wait .num{color:var(--amber)}
.mini .hint{font-size:11px;color:var(--t3);margin-top:2px}
h2{font-size:14px;margin:18px 4px 10px;color:var(--t2);font-weight:800;letter-spacing:.04em}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}
.bar i{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12));min-height:3px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.bar.cur i{background:linear-gradient(180deg,#bfffe0,#2fbf86);box-shadow:0 0 18px rgba(123,227,176,.5)}
.bar span{font-size:10px;color:var(--t3)}.bar.cur span{color:var(--mint);font-weight:800}
.bar b{font-size:9.5px;color:var(--t2);font-family:'Inter';font-weight:600;height:12px}
.studio{margin-bottom:10px;padding:0;overflow:hidden}
.studio>button{all:unset;display:block;width:100%;padding:16px;cursor:pointer;box-sizing:border-box}
.s-head{display:flex;align-items:center;gap:10px}
.s-head .nm{flex:1;font-weight:800;font-size:16px}
.s-head .cm{font-family:'Inter';font-weight:800;font-size:18px;color:var(--mint)}
.s-head .chev{color:var(--t3);transition:transform .2s}
.studio.open .chev{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--t1)}
.chip b{font-family:'Inter';color:var(--mint);margin-left:4px}
.detail{display:none;padding:0 16px 14px}
.studio.open .detail{display:block}
.inv{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.inv .d{color:var(--t3);width:54px;font-size:12px}
.inv .it{flex:1;color:var(--t2);font-size:12px}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.badge.paid{background:rgba(123,227,176,.18);color:var(--mint)}.badge.unpaid{background:rgba(255,207,112,.16);color:var(--amber)}
.inv .am{font-family:'Inter';font-weight:700;min-width:70px;text-align:right}
.feed .f{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed .f:first-child{border-top:none}
.feed .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(123,227,176,.15);font-size:17px}
.feed .tx{flex:1;font-size:13px}.feed .tx small{display:block;color:var(--t3);font-size:11px}
.feed .pl{font-family:'Inter';font-weight:800;color:var(--mint)}
.demo{width:100%;margin-top:14px;padding:16px;border:none;border-radius:18px;font:800 16px inherit;font-family:inherit;color:#04101a;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 50%),linear-gradient(135deg,#b3a3ff,#7ea82a);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),0 10px 26px rgba(124,92,255,.3)}
.note{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px}
/* celebration */
.cel{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,8,5,.72);padding:20px}
.cel.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cel .card{width:100%;max-width:340px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cel .em{font-size:54px}
.cel .amt{font-family:'Inter';font-size:52px;font-weight:800;color:var(--mint);margin:4px 0}
.cel p{margin:4px 0;color:var(--t2);font-size:14px}
.line{margin:16px 0 8px;text-align:left;background:#8cabd9;background:linear-gradient(#7494c0,#7494c0);border-radius:14px;padding:12px}
.line .hd{font-size:11px;color:#e9f1ff;margin-bottom:8px}
.bub{background:#fff;color:#111;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.45;max-width:92%}
.bub b{color:#06a047}
.cel .pill{margin-top:12px;width:100%;padding:13px;background:var(--green);border:none;color:#fff;font-size:15px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.bar{cursor:pointer;-webkit-tap-highlight-color:transparent}.bar.sel span{color:#fff;font-weight:800}.bar.sel i{outline:2px solid rgba(255,255,255,.8);outline-offset:2px}
.hintm{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px}
.md{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.md .mh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.md .mh b{font-size:16px}.md .mh span{margin-left:auto;font-family:'Inter';font-weight:800;font-size:22px;color:var(--mint)}
.md .sr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.md .sr .n{flex:1}.md .sr small{display:block;color:var(--t3);font-size:11px}.md .sr .c{font-family:'Inter';font-weight:800;color:var(--mint)}
.md .empty{color:var(--t3);font-size:13px;padding:8px 0}
</style></head><body>
<div class="wrap">
  <div class="top"><h1><span id="ttl"></span><small id="subttl"></small></h1><button class="pill on" id="th">ไทย</button><button class="pill" id="en">EN</button></div>
  <div class="who" id="who"></div>
  <div class="glass hero"><div class="lbl" id="heroLbl"></div><div class="big"><sup>฿</sup><span id="heroNum">0</span></div><div class="sub" id="heroSub"></div></div>
  <div class="row2">
    <div class="glass mini wait"><div class="lbl" id="waitLbl"></div><div class="num" id="waitNum">฿0</div><div class="hint" id="waitHint"></div></div>
    <div class="glass mini"><div class="lbl" id="yearLbl"></div><div class="num" id="yearNum">฿0</div><div class="hint" id="yearHint"></div></div>
  </div>
  <h2 id="hMonths"></h2>
  <div class="glass"><div class="chart" id="chart"></div><div class="hintm" id="chartHint"></div><div id="monthDetail"></div></div>
  <h2 id="hStudios"></h2>
  <div id="studios"></div>
  <h2 id="hFeed"></h2>
  <div class="glass feed" id="feed"></div>
  <div class="note" id="note"></div>
</div>
<div class="cel" id="cel"><div class="glass card"><div class="em">🎉</div><p id="celT"></p><div class="amt" id="celAmt"></div><p id="celS"></p>
  <button class="pill" id="celOk"></button></div></div>
<script>
const RATE=0.10, TODAY=new Date(), CUR=TODAY.getMonth(), YR=TODAY.getFullYear();
const T={th:{ttl:'KONG ยอดขาย',sub:'ค่าคอมมิชชั่นของฉัน',hero:'ค่าคอมเดือนนี้',heroSub:'จากสตูดิโอที่จ่ายเงินแล้ว',wait:'รอรับเงิน',waitH:'เมื่อสตูดิโอจ่าย คุณได้ 10%',year:'ทั้งปีนี้',yearH:'ตั้งแต่ ม.ค.',months:'ค่าคอมรายเดือน',studios:'สตูดิโอของฉัน',feed:'จ่ายเงินล่าสุด',sim:'▶ ลองดู: สตูดิโอจ่ายเงิน',note:'ข้อมูลสด · ค่าคอม 10% เมื่อสตูดิโอจ่ายเงิน · สตูดิโอที่ยัง active (สั่งใน 90 วันล่าสุด)',sold:'ขายไปแล้ว',paid:'จ่ายแล้ว',unpaid:'รอจ่าย',cel:'สตูดิโอจ่ายเงินแล้ว!',celS:'คุณได้ค่าคอม 10%',line:'ข้อความ LINE ที่คุณจะได้รับ',ok:'เยี่ยม!',inv:'ใบแจ้งหนี้',mon:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],msg:(s,a,c)=>`💰 ${s} จ่ายเงินแล้ว ฿${a}<br>คุณได้ค่าคอม <b>฿${c}</b> 🎉`,paidMsg:(n)=>n+' จ่ายแล้ว',pcs:'ชิ้น'},
en:{ttl:'KONG Sales',sub:'My commission',hero:'Commission this month',heroSub:'From studios that have paid',wait:'Waiting to be paid',waitH:'You earn 10% when the studio pays',year:'This year',yearH:'Since January',months:'Monthly commission',studios:'My studios',feed:'Latest payments',sim:'▶ Try it: a studio pays',note:'Live data · 10% commission when a studio pays · active = invoiced in the last 90 days',sold:'Sold',paid:'Paid',unpaid:'Unpaid',cel:'A studio just paid!',celS:'You earned 10% commission',line:'The LINE message you would get',ok:'Nice!',inv:'invoice',mon:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],msg:(s,a,c)=>`💰 ${s} paid ฿${a}<br>You earned <b>฿${c}</b> commission 🎉`,paidMsg:(n)=>n+' paid',pcs:'pcs'}};
let L='th', me='A';
let PR={};let inv=[];const MGR={A:{name:'Tip',studios:[]}};
const SKIP=new Set(['SHOPEE','Shopee','TIK TOK','TIK TOK SHOP','Trio Works Co., Ltd.','Pattaya Tattoo Festival']);
const P=new Proxy({},{get:(_,id)=>{const p=PR[id]||['?',0];return [p[0],p[0]]}});
const sb=supabase.createClient('https://ulhuyfqhtprjxdgvdkwx.supabase.co','sb_publishable_3JwPFYZbbEuLHsP5hmu19A_UX3yCxoq');
let knownPaid=null;
async function load(){
  let pr,iv;
  try{[pr,iv]=await Promise.all([sb.from('products').select('id,name,price'),sb.from('invoices').select('id,client,date,discount,paid,lines,paid_date')]);if(pr.error||iv.error)throw (pr.error||iv.error)}catch(e){console.error(e);if(!inv.length)note.textContent=L==='th'?'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรช':'Could not load data — try refreshing.';return}
  PR={};pr.data.forEach(p=>PR[p.id]=[p.name,+p.price||0]);
  const all=[];iv.data.forEach(r=>{if(SKIP.has(r.client)||!r.date)return;const items={};let sub=0;(r.lines||[]).forEach(l=>{if(!PR[l.productId])return;const q=+l.qty||0;items[l.productId]=(items[l.productId]||0)+q;sub+=PR[l.productId][1]*q});if(!sub)return;const paid=!!r.paid;all.push({id:r.id,studio:r.client,d:new Date(r.date),items,total:sub-(+r.discount||0),paid,paidOn:paid?new Date(r.paid_date||r.date):null,mgr:'A'})});
  const last={};all.forEach(i=>{if(!last[i.studio]||i.d>last[i.studio])last[i.studio]=i.d});
  const act=Object.keys(last).filter(st=>(TODAY-last[st])/864e5<=90); // active = invoiced in the last 90 days
  inv=all.filter(i=>act.includes(i.studio));
  const tot={};inv.forEach(i=>tot[i.studio]=(tot[i.studio]||0)+i.total);MGR.A.studios=act.sort((a,b)=>tot[b]-tot[a]);
  const nowPaid=new Set(inv.filter(i=>i.paid).map(i=>i.id));
  if(knownPaid){const fresh=inv.filter(i=>i.paid&&!knownPaid.has(i.id));if(fresh.length)celebrate(fresh[0])}
  knownPaid=nowPaid;
  render();
}
const THB=n=>Math.round(n).toLocaleString('en-US');
const mine=()=>inv.filter(i=>i.mgr===me);
const comm=i=>i.total*RATE;
let selM=null;
function renderMonth(){const el=document.getElementById('monthDetail');if(selM===null){el.innerHTML='';return}
 const t=T[L];const rows=mine().filter(i=>i.paid&&i.paidOn.getFullYear()===YR&&i.paidOn.getMonth()===selM);
 const by={};rows.forEach(i=>{(by[i.studio]=by[i.studio]||{c:0,n:0,amt:0});by[i.studio].c+=comm(i);by[i.studio].n++;by[i.studio].amt+=i.total});
 const tot=rows.reduce((a,i)=>a+comm(i),0);
 const list=Object.entries(by).sort((a,b)=>b[1].c-a[1].c);
 el.innerHTML=`<div class="md"><div class="mh"><b>${t.mon[selM]} ${YR}</b><span>฿${THB(tot)}</span></div>`+(list.length?list.map(([st,v])=>`<div class="sr"><div class="n">${st}<small>${v.n} ${L==='th'?'ใบ · ยอดขาย':'invoice(s) · sales'} ฿${THB(v.amt)}</small></div><div class="c">+฿${THB(v.c)}</div></div>`).join(''):`<div class="empty">${L==='th'?'ยังไม่มีการจ่ายเงินในเดือนนี้':'No payments this month yet'}</div>`)+`</div>`}
document.getElementById('chart').addEventListener('click',e=>{const b=e.target.closest('.bar');if(!b)return;const m=+b.dataset.m;selM=(selM===m)?null:m;document.querySelectorAll('#chart .bar').forEach(x=>x.classList.toggle('sel',+x.dataset.m===selM));renderMonth()});
function stats(){const m=mine();const byM=Array(12).fill(0);m.filter(i=>i.paid&&i.paidOn.getFullYear()===YR).forEach(i=>byM[i.paidOn.getMonth()]+=comm(i));const wait=m.filter(i=>!i.paid).reduce((a,i)=>a+comm(i),0);return{byM,wait,year:byM.reduce((a,b)=>a+b,0)}}
function countUp(el,to,pre=''){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=pre+THB(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function render(){const t=T[L];document.documentElement.lang=L;
 ttl.textContent=t.ttl;subttl.textContent=t.sub;heroLbl.textContent=t.hero;heroSub.textContent=t.heroSub;waitLbl.textContent=t.wait;waitHint.textContent=t.waitH;yearLbl.textContent=t.year;yearHint.textContent=t.yearH;hMonths.textContent=t.months;hStudios.textContent=t.studios;hFeed.textContent=t.feed;note.textContent=t.note;celT.textContent=t.cel;celS.textContent=t.celS;celOk.textContent=t.ok;
 th.classList.toggle('on',L==='th');en.classList.toggle('on',L==='en');
 who.innerHTML=Object.entries(MGR).map(([k,m])=>`<button class="pill ${k===me?'on':''}" data-k="${k}">👤 ${m.name}</button>`).join('');
 const s=stats();countUp(heroNum,s.byM[CUR]);countUp(waitNum,s.wait,'฿');countUp(yearNum,s.year,'฿');
 const mx=Math.max(1,...s.byM);chart.innerHTML=s.byM.map((v,i)=>`<div class="bar ${i===CUR?'cur':''} ${i===selM?'sel':''}" data-m="${i}" style="${i>CUR?'opacity:.35':''}"><b>${v&&i>=CUR-2&&i<=CUR?THB(v):''}</b><i style="height:3px" data-h="${Math.max(3,v/mx*100)}"></i><span>${t.mon[i]}</span></div>`).join('');
 chartHint.textContent=L==='th'?'แตะแท่งเพื่อดูรายละเอียดของเดือนนั้น':'Tap a month to see its details';renderMonth();
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#chart i').forEach(e=>e.style.height=e.dataset.h+'%')));
 studios.innerHTML=MGR[me].studios.map(st=>{const ii=mine().filter(i=>i.studio===st).sort((a,b)=>b.d-a.d);const sold={};ii.filter(i=>i.paid).forEach(i=>Object.entries(i.items).forEach(([p,q])=>sold[p]=(sold[p]||0)+q));const cm=ii.filter(i=>i.paid&&i.paidOn.getMonth()===CUR&&i.paidOn.getFullYear()===YR).reduce((a,i)=>a+comm(i),0);
  return`<div class="glass studio" data-s="${st}"><button><div class="s-head"><div class="nm">${st}</div><div class="cm">฿${THB(cm)}</div><div class="chev">›</div></div><div class="chips">${Object.entries(sold).map(([p,q])=>`<span class="chip">${P[p][L==='th'?0:1]}<b>×${q}</b></span>`).join('')}</div></button>
  <div class="detail">${ii.slice(0,6).map(i=>`<div class="inv"><span class="d">${i.d.getDate()} ${t.mon[i.d.getMonth()]}</span><span class="it">${Object.entries(i.items).map(([p,q])=>P[p][L==='th'?0:1]+' ×'+q).join(', ')}</span><span class="badge ${i.paid?'paid':'unpaid'}">${i.paid?t.paid:t.unpaid}</span><span class="am">฿${THB(i.total)}</span></div>`).join('')}</div></div>`}).join('');
 feed.innerHTML=mine().filter(i=>i.paid).sort((a,b)=>b.paidOn-a.paidOn).slice(0,5).map(i=>`<div class="f"><div class="ic">💰</div><div class="tx">${t.paidMsg(i.studio)}<small>${i.paidOn.getDate()} ${t.mon[i.paidOn.getMonth()]} · ฿${THB(i.total)}</small></div><div class="pl">+฿${THB(comm(i))}</div></div>`).join('')}
studios.addEventListener('click',e=>{const c=e.target.closest('.studio');if(c)c.classList.toggle('open')});
who.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){me=b.dataset.k;render()}});
th.onclick=()=>{L='th';render()};en.onclick=()=>{L='en';render()};
function celebrate(i){const t=T[L];celAmt.textContent='+฿'+THB(comm(i));document.getElementById('celS').textContent=i.studio+' · '+t.celS;cel.classList.add('show');
 for(let k=0;k<26;k++){const c=document.createElement('div');c.className='confetti';c.textContent=['🎉','✨','💚','🪙'][k%4];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.6+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}
celOk.onclick=()=>cel.classList.remove('show');
load();setInterval(load,30000);
</script></body></html>
